<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnapdragonLLM · tablet</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e9e4d8;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .stage {
        width: 850px;
        height: 590px;
      }
      .wrap {
        width: 1180px;
        height: 820px;
        transform: scale(0.72);
        transform-origin: top left;
      }
      iframe {
        width: 1180px;
        height: 820px;
        border: 0;
        border-radius: 26px;
        background: #f5f2ea;
        box-shadow: 0 30px 70px rgba(31, 29, 22, 0.22);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="wrap">
        <iframe src="/?layout=app" title="Tablet preview"></iframe>
      </div>
    </div>
  </body>
</html>
